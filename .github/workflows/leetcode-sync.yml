# 🟢 LeetCode Sync — Auto-push LeetCode solutions to GitHub
# Runs at varied, organic-looking times to keep the contribution graph natural.
#
# ⚠️ SETUP REQUIRED:
# 1. Go to https://leetcode.com → F12 → Application → Cookies
#    → Copy LEETCODE_SESSION and csrftoken
# 2. Repo → Settings → Secrets → Actions
#    → Add: LEETCODE_SESSION and LEETCODE_CSRF_TOKEN
#
# 🔄 Session cookies expire every ~1-2 weeks. Refresh when sync fails.

name: LeetCode Sync

on:
  schedule:
    # Staggered times to make the graph look organic (not evenly spaced)
    - cron: "23 5 * * *"    # ~5:23 AM UTC (some days catch morning solves)
    - cron: "47 14 * * *"   # ~2:47 PM UTC (afternoon sync)
    - cron: "11 21 * * *"   # ~9:11 PM UTC (evening sync)
  workflow_dispatch:         # Manual trigger

jobs:
  leetcode-sync:
    runs-on: ubuntu-latest
    steps:
      # Random delay (0-45 min) so commits don't land at exact cron times
      - name: Random Delay
        run: |
          DELAY=$((RANDOM % 2700))
          echo "⏳ Waiting ${DELAY}s to randomize commit time..."
          sleep $DELAY

      # Randomly skip ~30% of runs so some days get 2 commits, some get 3, some get 1
      - name: Random Skip Check
        id: skip_check
        run: |
          ROLL=$((RANDOM % 100))
          echo "🎲 Roll: $ROLL"
          if [ $ROLL -lt 30 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping this run to vary the graph"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Running sync"
          fi

      - name: Sync LeetCode Solutions
        if: steps.skip_check.outputs.skip != 'true'
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: leetcode-solutions
